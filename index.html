<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek AI Studio - VN Editor Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Navbar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1a1a1a; border-bottom: 1px solid #2c2c2c; }
        header h1 { font-size: 16px; color: #ff5722; }
        .export-btn { background: #ff5722; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* Video Preview Area */
        .preview-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .upload-overlay { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .upload-overlay label { background: #2b2b2b; padding: 10px 20px; border-radius: 6px; cursor: pointer; border: 1px solid #444; }

        /* Timeline Area (VN Style) */
        .timeline-section { height: 180px; background: #181818; border-top: 1px solid #2c2c2c; display: flex; flex-direction: column; }
        .timeline-tools { display: flex; gap: 15px; padding: 8px 15px; background: #1f1f1f; border-bottom: 1px solid #2c2c2c; font-size: 13px; color: #bbb; overflow-x: auto; }
        .timeline-tools span { cursor: pointer; padding: 4px 8px; border-radius: 4px; background: #2a2a2a; white-space: nowrap; }
        .timeline-tools span:hover { background: #ff5722; color: #fff; }
        
        .tracks-container { flex: 1; padding: 10px; overflow-x: auto; display: flex; flex-direction: column; gap: 8px; }
        .track { height: 45px; background: #222; border-radius: 6px; border: 1px dashed #444; display: flex; align-items: center; padding: 0 10px; position: relative; }
        .track-label { font-size: 10px; color: #777; position: absolute; top: 2px; left: 8px; }
        .clip-box { background: #ff5722; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; min-width: 100px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Vivek AI Studio</h1>
        <button class="export-btn" onclick="alert('Exporting video...')">Export ↗</button>
    </header>

    <div class="preview-container">
        <div class="upload-overlay" id="uploadOverlay">
            <input type="file" id="mediaInput" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <label for="mediaInput">＋ Tap to Import Video (VN Style)</label>
        </div>
        <video id="mainVideo" controls style="display: none;"></video>
    </div>

    <div class="timeline-section">
        <div class="timeline-tools">
            <span onclick="splitClip()">✂ Split</span>
            <span onclick="trimClip()">⏳ Trim</span>
            <span onclick="addFilter()">🎨 Filter</span>
            <span onclick="addText()">💬 Subtitle</span>
            <span onclick="addAudio()">🎵 Music</span>
        </div>
        <div class="tracks-container">
            <div class="track" id="videoTrack">
                <span class="track-label">VIDEO</span>
                <span style="font-size: 11px; color: #555; width: 100%; text-align: center;">Timeline is empty</span>
            </div>
        </div>
    </div>

    <script>
        const mainVideo = document.getElementById('mainVideo');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const videoTrack = document.getElementById('videoTrack');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                mainVideo.src = url;
                mainVideo.style.display = 'block';
                uploadOverlay.style.display = 'none';

                // Populate Timeline Track
                videoTrack.innerHTML = '<span class="track-label">VIDEO</span><div class="clip-box">Main Video Clip</div>';
            }
        }

        function splitClip() {
            if (!mainVideo.src) { alert('Please load a video first!'); return; }
            alert('Video split at time: ' + mainVideo.currentTime.toFixed(2) + 's');
        }

        function trimClip() { if(mainVideo.src) alert('Select start and end handles on timeline.'); else alert('Load video first.'); }
        function addFilter() { alert('Color filters (LUTs) panel opening...'); }
        function addText() { alert('Text / Subtitle editor opening...'); }
        function addAudio() { alert('Audio track manager opening...'); }
    </script>
</body>
</html>
