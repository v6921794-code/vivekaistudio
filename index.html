<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek AI Studio - YouTube Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        body { background: #0f0f0f; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* YouTube Top Navbar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #212121; border-bottom: 1px solid #383838; }
        .logo-area { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; color: #ff0000; }
        .search-bar { background: #121212; border: 1px solid #303030; padding: 6px 12px; border-radius: 20px; color: #fff; width: 40%; font-size: 14px; }
        .user-profile { font-size: 13px; background: #333; padding: 5px 10px; border-radius: 50%; font-weight: bold; }

        /* Main Content Layout */
        .main-container { flex: 1; display: flex; overflow: hidden; }
        
        /* Left/Center: Video Player & Details */
        .content-area { flex: 2; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .player-wrapper { width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .video-title { font-size: 18px; font-weight: 600; color: #f1f1f1; }
        .video-actions { display: flex; gap: 15px; font-size: 13px; color: #aaa; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .video-actions span { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .video-actions span:hover { color: #fff; }

        /* Right Sidebar: Recommendations / Upload Feed */
        .sidebar { flex: 1; background: #181818; border-left: 1px solid #282828; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .sidebar h3 { font-size: 14px; margin-bottom: 5px; color: #aaa; }
        
        .recommendation-card { display: flex; gap: 10px; cursor: pointer; padding: 6px; border-radius: 6px; transition: 0.2s; }
        .recommendation-card:hover { background: #272727; }
        .thumbnail-box { width: 120px; height: 70px; background: #333; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #888; flex-shrink: 0; overflow: hidden; }
        .thumbnail-box video { width: 100%; height: 100%; object-fit: cover; }
        .rec-info { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .rec-title { font-size: 13px; font-weight: 500; color: #f1f1f1; line-height: 1.2; }
        .rec-channel { font-size: 11px; color: #aaa; }

        .upload-section { background: #222; padding: 10px; border-radius: 8px; text-align: center; border: 1px dashed #555; }
        .upload-section label { font-size: 13px; color: #3ea6ff; cursor: pointer; font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">▶ Vivek Tube</div>
        <input type="text" class="search-bar" placeholder="Search videos...">
        <div class="user-profile">VT</div>
    </header>

    <div class="main-container">
        <!-- Main Video Watch Section -->
        <div class="content-area">
            <div class="player-wrapper">
                <video id="mainPlayer" controls poster="" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
            </div>
            <div class="video-title" id="displayTitle">Big Buck Bunny - Official Cinematic Sample</div>
            <div class="video-actions">
                <span>👍 Like</span>
                <span>👎 Dislike</span>
                <span> शेअर Share</span>
                <span> 📥 Download</span>
                <span onclick="triggerUpload()" style="color: #3ea6ff; font-weight: bold;">＋ Upload Video</span>
            </div>
        </div>

        <!-- Sidebar Recommendations & Custom Uploads -->
        <div class="sidebar">
            <div class="upload-section">
                <input type="file" id="localVideoInput" accept="video/*" style="display: none;" onchange="loadCustomVideo(event)">
                <label for="localVideoInput">＋ Upload Your Own Video</label>
            </div>
            <h3>Up Next / Feed</h3>
            
            <div class="recommendation-card" onclick="changeVideo('https://www.w3schools.com/html/mov_bbb.mp4', 'Big Buck Bunny - Official Cinematic Sample')">
                <div class="thumbnail-box"><video src="https://www.w3schools.com/html/mov_bbb.mp4"></video></div>
                <div class="rec-info">
                    <div class="rec-title">Big Buck Bunny</div>
                    <div class="rec-channel">Blender Foundation</div>
                </div>
            </div>

            <div class="recommendation-card" onclick="changeVideo('https://www.w3schools.com/html/movie.mp4', 'HTML5 Sample Video Presentation')">
                <div class="thumbnail-box"><video src="https://www.w3schools.com/html/movie.mp4"></video></div>
                <div class="rec-info">
                    <div class="rec-title">HTML5 Sample Video</div>
                    <div class="rec-channel">W3Schools Official</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const mainPlayer = document.getElementById('mainPlayer');
        const displayTitle = document.getElementById('displayTitle');
        const localVideoInput = document.getElementById('localVideoInput');

        function changeVideo(url, title) {
            mainPlayer.src = url;
            mainPlayer.play();
            displayTitle.innerText = title;
        }

        function triggerUpload() {
            localVideoInput.click();
        }

        function loadCustomVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                changeVideo(url, file.name);
            }
        }
    </script>
</body>
</html>
