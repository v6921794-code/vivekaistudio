<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle - Talk to strangers!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #fffaed; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Classic Omegle Header */
        header { padding: 8px 15px; border-bottom: 2px solid #e5c158; display: flex; justify-content: space-between; align-items: center; background: #fff; height: 45px; }
        .logo { font-size: 24px; font-weight: bold; color: #ff5722; text-shadow: 1px 1px 0px #000; }
        .tagline { font-size: 12px; color: #666; font-style: italic; }

        /* Split Screen Container: Top Video & Bottom Chat */
        .omegle-container { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 45px); overflow: hidden; }

        /* Top Half: Video Section (Aadhi Upar) */
        .top-video-section { flex: 1; display: flex; flex-direction: column; background: #000; border-bottom: 2px solid #e5c158; min-height: 0; }
        .videos-wrapper { flex: 1; display: flex; width: 100%; height: 100%; }
        .video-pane { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border-right: 1px solid #333; }
        .video-pane video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .video-label { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; z-index: 2; }

        /* Controls Bar right below videos */
        .video-control-bar { background: #111; padding: 6px; display: flex; justify-content: center; align-items: center; }
        .btn-omegle { padding: 6px 20px; background: #ff5722; color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-omegle:hover { background: #e64a19; }

        /* Bottom Half: Chat Section (Aadhi Niche) */
        .bottom-chat-section { flex: 1; display: flex; flex-direction: column; background: #fff; min-height: 0; }
        .chat-log-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 13px; background: #fff; }
        
        .chat-line { line-height: 1.3; }
        .chat-line.stranger { color: red; font-weight: bold; }
        .chat-line.you { color: blue; font-weight: bold; }
        .chat-line.status { color: #00a; font-style: italic; font-size: 12px; border-bottom: 1px dotted #ccc; padding-bottom: 3px; }

        /* Typing & Send Bar */
        .chat-typing-bar { display: flex; padding: 8px; background: #f5f5f5; border-top: 1px solid #ddd; gap: 6px; }
        .chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
        .btn-send { background: #0066cc; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-send:hover { background: #004d99; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Omegle</div>
        <div class="tagline">Talk to strangers with your webcam!</div>
    </header>

    <div class="omegle-container">
        <!-- TOP: Camera Screens & New/Esc Button -->
        <div class="top-video-section">
            <div class="videos-wrapper">
                <div class="video-pane">
                    <video id="strangerVideo" autoplay playsinline muted></video>
                    <div class="video-label">Stranger</div>
                </div>
                <div class="video-pane">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="video-label">You</div>
                </div>
            </div>
            <div class="video-control-bar">
                <button class="btn-omegle" id="escBtn" onclick="handleNewOrEsc()">New / Esc</button>
            </div>
        </div>

        <!-- BOTTOM: Chat Log & Input Field -->
        <div class="bottom-chat-section">
            <div class="chat-log-box" id="chatLog">
                <div class="chat-line status">Connecting to server...</div>
                <div class="chat-line status">You're now chatting with a random stranger. Say hi!</div>
            </div>
            <div class="chat-typing-bar">
                <input type="text" id="msgInput" class="chat-input" placeholder="Type a message here..." onkeypress="checkKey(event)">
                <button class="btn-send" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatLog = document.getElementById('chatLog');
        const msgInput = document.getElementById('msgInput');
        const escBtn = document.getElementById('escBtn');
        const localVideo = document.getElementById('localVideo');
        
        let sessionActive = true;

        // Auto start webcam on load
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
            } catch (err) {
                appendStatus("Webcam access denied or unavailable.");
            }
        }
        startWebcam();

        function appendStatus(text) {
            const div = document.createElement('div');
            div.className = 'chat-line status';
            div.innerText = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = 'chat-line ' + sender;
            div.innerText = (sender === 'you' ? 'You: ' : 'Stranger: ') + text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function sendMsg() {
            const txt = msgInput.value.trim();
            if (!txt || !sessionActive) return;
            appendMsg('you', txt);
            msgInput.value = '';

            // Omegle style automatic reply simulator
            setTimeout(() => {
                if (sessionActive) {
                    const replies = [
                        "Hello! Kahan se ho?",
                        "Hi there!",
                        "What's up?",
                        "Nice to meet you!",
                        "Ji boliye, kya chal raha hai?"
                    ];
                    const reply = replies[Math.floor(Math.random() * replies.length)];
                    appendMsg('stranger', reply);
                }
            }, 1000);
        }

        function checkKey(e) {
            if (e.key === 'Enter') {
                sendMsg();
            }
        }

        function handleNewOrEsc() {
            appendStatus("You have disconnected.");
            sessionActive = false;
            escBtn.innerText = "Connecting...";

            setTimeout(() => {
                chatLog.innerHTML = '';
                appendStatus("Looking for someone you may know...");
                setTimeout(() => {
                    appendStatus("Connected with a new stranger!");
                    sessionActive = true;
                    escBtn.innerText = "New / Esc";
                }, 1500);
            }, 1000);
        }
    </script>
</body>
</html>
