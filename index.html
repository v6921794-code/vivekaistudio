<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle - Login & Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #fffaed; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Login Overlay Modal */
        #loginModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; border: 2px solid #e5c158; }
        .login-box h2 { color: #ff5722; text-align: center; font-size: 22px; }
        .login-input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .login-btn { background: #ff5722; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .login-btn:hover { background: #e64a19; }

        /* App Header & Navigation Tabs */
        header { padding: 8px 15px; border-bottom: 2px solid #e5c158; display: flex; justify-content: space-between; align-items: center; background: #fff; height: 45px; }
        .logo { font-size: 22px; font-weight: bold; color: #ff5722; text-shadow: 1px 1px 0px #000; }
        .nav-tabs { display: flex; gap: 5px; }
        .tab-btn { padding: 5px 10px; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #ff5722; color: #fff; border-color: #e64a19; }

        /* Views Container */
        .view-container { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 45px); overflow: hidden; position: relative; }
        .app-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; background: #fffaed; }
        .app-view.active { display: flex; }

        /* 1. Omegle Split Screen View */
        .omegle-container { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .top-video-section { flex: 1; display: flex; flex-direction: column; background: #000; border-bottom: 2px solid #e5c158; min-height: 0; }
        .videos-wrapper { flex: 1; display: flex; width: 100%; height: 100%; }
        .video-pane { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border-right: 1px solid #333; }
        .video-pane video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .video-label { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; z-index: 2; }
        .video-control-bar { background: #111; padding: 6px; display: flex; justify-content: center; align-items: center; }
        .btn-omegle { padding: 6px 20px; background: #ff5722; color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }

        .bottom-chat-section { flex: 1; display: flex; flex-direction: column; background: #fff; min-height: 0; }
        .chat-log-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 13px; background: #fff; }
        .chat-line { line-height: 1.3; }
        .chat-line.stranger { color: red; font-weight: bold; }
        .chat-line.you { color: blue; font-weight: bold; }
        .chat-line.status { color: #00a; font-style: italic; font-size: 12px; border-bottom: 1px dotted #ccc; padding-bottom: 3px; }
        .chat-typing-bar { display: flex; padding: 8px; background: #f5f5f5; border-top: 1px solid #ddd; gap: 6px; }
        .chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
        .btn-send { background: #0066cc; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }

        /* 2. Global / Community Chat View */
        .global-chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #fff; }
        .global-msg { background: #f1f1f1; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        .global-msg strong { color: #ff5722; }
    </style>
</head>
<body>

    <!-- Login Modal Popup -->
    <div id="loginModal">
        <div class="login-box">
            <h2>Omegle Login</h2>
            <p style="font-size:12px; color:#666; text-align:center;">Enter your Mobile Number or Email ID to continue.</p>
            <input type="text" id="userCredential" class="login-input" placeholder="Mobile Number or Email ID">
            <button class="login-btn" onclick="handleLogin()">Start Chatting</button>
        </div>
    </div>

    <header>
        <div class="logo">Omegle</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchView('omegle', this)">Video & Chat</button>
            <button class="tab-btn" onclick="switchView('global', this)">Community Chat</button>
        </div>
    </header>

    <div class="view-container">
        <!-- VIEW 1: Omegle Split Video & Chat -->
        <div id="omegleView" class="app-view active">
            <div class="omegle-container">
                <div class="top-video-section">
                    <div class="videos-wrapper">
                        <div class="video-pane">
                            <video id="strangerVideo" autoplay playsinline muted></video>
                            <div class="video-label">Stranger</div>
                        </div>
                        <div class="video-pane">
                            <video id="localVideo" autoplay playsinline muted></video>
                            <div class="video-label" id="myLabel">You</div>
                        </div>
                    </div>
                    <div class="video-control-bar">
                        <button class="btn-omegle" id="escBtn" onclick="handleNewOrEsc()">New / Esc</button>
                    </div>
                </div>

                <div class="bottom-chat-section">
                    <div class="chat-log-box" id="chatLog">
                        <div class="chat-line status">Connecting to server...</div>
                        <div class="chat-line status">You're now chatting with a random stranger. Say hi!</div>
                    </div>
                    <div class="chat-typing-bar">
                        <input type="text" id="msgInput" class="chat-input" placeholder="Type a message here..." onkeypress="checkKey(event)">
                        <button class="btn-send" onclick="sendMsg()">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: Community Global Chat -->
        <div id="globalView" class="app-view">
            <div class="global-chat-box" id="globalChatLog">
                <div class="global-msg"><strong>System:</strong> Welcome to Community Lounge! Say hello to everyone.</div>
            </div>
            <div class="chat-typing-bar">
                <input type="text" id="globalInput" class="chat-input" placeholder="Type message to everyone..." onkeypress="checkGlobalKey(event)">
                <button class="btn-send" onclick="sendGlobalMsg()">Post</button>
            </div>
        </div>
    </div>

    <script>
        let loggedUser = "";

        function handleLogin() {
            const val = document.getElementById('userCredential').value.trim();
            if(!val) {
                alert("Please enter a valid Mobile Number or Email ID!");
                return;
            }
            loggedUser = val;
            document.getElementById('myLabel').innerText = "You (" + val + ")";
            document.getElementById('loginModal').style.display = 'none';
            startWebcam();
        }

        function switchView(viewName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));

            btn.classList.add('active');
            if(viewName === 'omegle') {
                document.getElementById('omegleView').classList.add('active');
            } else {
                document.getElementById('globalView').classList.add('active');
            }
        }

        const chatLog = document.getElementById('chatLog');
        const msgInput = document.getElementById('msgInput');
        const escBtn = document.getElementById('escBtn');
        const localVideo = document.getElementById('localVideo');
        let sessionActive = true;

        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
            } catch (err) {
                console.log("Webcam access denied.");
            }
        }

        function appendStatus(text) {
            const div = document.createElement('div');
            div.className = 'chat-line status';
            div.innerText = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = 'chat-line ' + sender;
            div.innerText = (sender === 'you' ? 'You: ' : 'Stranger: ') + text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function sendMsg() {
            const txt = msgInput.value.trim();
            if (!txt || !sessionActive) return;
            appendMsg('you', txt);
            msgInput.value = '';

            setTimeout(() => {
                if (sessionActive) {
                    const replies = ["Hello!", "Aap kahan se ho?", "Nice to meet you!", "Ji boliye!"];
                    appendMsg('stranger', replies[Math.floor(Math.random() * replies.length)]);
                }
            }, 1000);
        }

        function checkKey(e) {
            if (e.key === 'Enter') sendMsg();
        }

        function handleNewOrEsc() {
            appendStatus("You have disconnected.");
            sessionActive = false;
            escBtn.innerText = "Connecting...";

            setTimeout(() => {
                chatLog.innerHTML = '';
                appendStatus("Looking for someone you may know...");
                setTimeout(() => {
                    appendStatus("Connected with a new stranger!");
                    sessionActive = true;
                    escBtn.innerText = "New / Esc";
                }, 1500);
            }, 1000);
        }

        // Global Chat Logic
        const globalChatLog = document.getElementById('globalChatLog');
        const globalInput = document.getElementById('globalInput');

        function sendGlobalMsg() {
            const txt = globalInput.value.trim();
            if(!txt) return;
            const div = document.createElement('div');
            div.className = 'global-msg';
            div.innerHTML = `<strong>${loggedUser || 'User'}:</strong> ${txt}`;
            globalChatLog.appendChild(div);
            globalChatLog.scrollTop = globalChatLog.scrollHeight;
            globalInput.value = '';
        }

        function checkGlobalKey(e) {
            if(e.key === 'Enter') sendGlobalMsg();
        }
    </script>
</body>
</html>
