<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek AI Studio - VN Engine Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
        body { background: #0b0b0b; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* VN Top Bar */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #141414; border-bottom: 1px solid #222; }
        header h1 { font-size: 15px; color: #ff5722; font-weight: 700; }
        .export-btn { background: #ff5722; color: #fff; border: none; padding: 6px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }

        /* Video Preview Stage */
        .stage { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .import-prompt { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; }
        .import-btn { background: #262626; border: 1px solid #444; color: #fff; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .import-btn:hover { background: #ff5722; border-color: #ff5722; }

        #liveSub { position: absolute; bottom: 30px; background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 4px; font-size: 18px; font-weight: bold; color: #fff; display: none; }

        /* VN Bottom Timeline Studio */
        .vn-studio { height: 240px; background: #181818; border-top: 1px solid #262626; display: flex; flex-direction: column; }
        
        /* Toolbar Menu */
        .vn-toolbar { display: flex; gap: 18px; padding: 10px 16px; background: #1e1e1e; border-bottom: 1px solid #262626; overflow-x: auto; white-space: nowrap; }
        .vn-tool { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-size: 11px; color: #aaa; }
        .vn-tool span:first-child { font-size: 16px; }
        .vn-tool:hover { color: #ff5722; }

        /* Tracks Area */
        .vn-tracks { flex: 1; padding: 10px; overflow-x: auto; display: flex; flex-direction: column; gap: 6px; position: relative; }
        .vn-track { height: 42px; background: #222; border-radius: 4px; border: 1px dashed #3a3a3a; display: flex; align-items: center; padding: 0 8px; position: relative; min-width: 500px; }
        .track-tag { font-size: 8px; color: #777; position: absolute; top: 2px; left: 8px; font-weight: bold; }
        
        /* Timeline Elements */
        .vn-clip { background: #ff5722; height: 30px; border-radius: 3px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; font-weight: bold; color: #fff; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        .audio-track-item { background: #2196f3 !important; }
        .text-track-item { background: #4caf50 !important; }
    </style>
</head>
<body>

    <header>
        <h1>Vivek AI Studio — VN Engine</h1>
        <button class="export-btn" onclick="alert('Rendering project via JavaScript Engine...')">Export ↗</button>
    </header>

    <div class="stage">
        <div class="import-prompt" id="importPrompt">
            <input type="file" id="vidFile" accept="video/*" style="display: none;" onchange="initVNProject(event)">
            <label for="vidFile" class="import-btn">＋ Import Video (VN Studio)</label>
        </div>
        <video id="vnVideo" controls style="display: none;"></video>
        <div id="liveSub"></div>
        <audio id="vnAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>
    </div>

    <div class="vn-studio">
        <div class="vn-toolbar">
            <div class="vn-tool" onclick="vnSplit()"><span>✂️</span><span>Split</span></div>
            <div class="vn-tool" onclick="vnFilter()"><span>🎨</span><span>Filter</span></div>
            <div class="vn-tool" onclick="vnSubtitle()"><span>💬</span><span>Subtitle</span></div>
            <div class="vn-tool" onclick="vnAudioToggle()"><span>🎵</span><span>Music</span></div>
            <div class="vn-tool" onclick="vnSpeed()"><span>⚡</span><span>Speed</span></div>
            <div class="vn-tool" onclick="location.reload()"><span>🗑️</span><span>Reset</span></div>
        </div>

        <div class="vn-tracks">
            <!-- Video Track -->
            <div class="vn-track">
                <span class="track-tag">MAIN VIDEO</span>
                <div class="vn-clip" id="vidClip" style="display: none;">
                    <span id="vName">video.mp4</span>
                    <span id="vLen" style="font-size: 10px;">0.0s</span>
                </div>
            </div>
            <!-- Audio Track -->
            <div class="vn-track">
                <span class="track-tag">BACKGROUND MUSIC</span>
                <div class="vn-clip audio-track-item" id="audClip" style="display: none;">
                    <span>🎵 Cinematic Beats.mp3</span>
                    <span style="font-size: 10px;">Active</span>
                </div>
            </div>
            <!-- Subtitle Track -->
            <div class="vn-track">
                <span class="track-tag">TEXT / SUBTITLE</span>
                <div class="vn-clip text-track-item" id="txtClip" style="display: none;">
                    <span id="subTextVal">Sample Subtitle</span>
                    <span style="font-size: 10px;">Active</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vnVideo = document.getElementById('vnVideo');
        const vnAudio = document.getElementById('vnAudio');
        const importPrompt = document.getElementById('importPrompt');
        const liveSub = document.getElementById('liveSub');
        
        const vidClip = document.getElementById('vidClip');
        const audClip = document.getElementById('audClip');
        const txtClip = document.getElementById('txtClip');
        
        const vName = document.getElementById('vName');
        const vLen = document.getElementById('vLen');
        const subTextVal = document.getElementById('subTextVal');

        let musicEnabled = true;

        function initVNProject(e) {
            const file = e.target.files[0];
            if (file) {
                const objectURL = URL.createObjectURL(file);
                vnVideo.src = objectURL;
                vnVideo.style.display = 'block';
                importPrompt.style.display = 'none';

                vnVideo.onloadedmetadata = function() {
                    vName.innerText = file.name.length > 15 ? file.name.substring(0, 12) + '...' : file.name;
                    vLen.innerText = vnVideo.duration.toFixed(1) + 's';
                    vidClip.style.display = 'flex';
                };

                vnAudio.play().catch(err => console.log("Audio waiting for user gesture"));
                audClip.style.display = 'flex';
            }
        }

        // VN App multi-track sync logic via JavaScript
        vnVideo.onplay = () => { if(musicEnabled) vnAudio.play(); };
        vnVideo.onpause = () => { vnAudio.pause(); };

        function vnSplit() {
            if (!vnVideo.src) { alert('Please import video first!'); return; }
            const t = vnVideo.currentTime.toFixed(2);
            alert(`✂ Clip split successfully at timestamp: ${t}s`);
        }

        const filterArray = ['none', 'grayscale(100%)', 'sepia(70%)', 'contrast(140%)', 'invert(15%)'];
        let fIdx = 0;
        function vnFilter() {
            if (!vnVideo.src) { alert('Please import video first!'); return; }
            fIdx = (fIdx + 1) % filterArray.length;
            vnVideo.style.filter = filterArray[fIdx];
            alert(`🎨 Applied Color Grade: ${filterArray[fIdx].toUpperCase()}`);
        }

        function vnSubtitle() {
            if (!vnVideo.src) { alert('Please import video first!'); return; }
            let text = prompt("Enter subtitle caption text:", "Vivek AI Studio Pro");
            if (text) {
                liveSub.innerText = text;
                liveSub.style.display = 'block';
                subTextVal.innerText = text;
                txtClip.style.display = 'flex';
            }
        }

        function vnAudioToggle() {
            musicEnabled = !musicEnabled;
            if (musicEnabled) {
                vnAudio.play();
                audClip.style.opacity = '1';
                alert('🎵 Background music track unmuted');
            } else {
                vnAudio.pause();
                audClip.style.opacity = '0.3';
                alert('🔇 Background music track muted');
            }
        }

        function vnSpeed() {
            if (!vnVideo.src) { alert('Please import video first!'); return; }
            const rates = [0.5, 1.0, 1.5, 2.0];
            let next = rates[(rates.indexOf(vnVideo.playbackRate) + 1) % rates.length];
            vnVideo.playbackRate = next;
            alert(`⚡ Timeline Speed updated to: ${next}x`);
        }
    </script>
</body>
</html>
