<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek Omegle - Live Video Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: 12px 20px; background: #1f1f1f; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; color: #ff5722; font-weight: bold; }
        .status-badge { font-size: 12px; background: #2e7d32; padding: 4px 10px; border-radius: 12px; color: #fff; }

        .chat-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; max-width: 900px; margin: 0 auto; width: 100%; }
        
        .video-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; min-height: 0; }
        .video-box { background: #000; border-radius: 12px; border: 2px solid #2a2a2a; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index: 2; }

        .controls-bar { display: flex; justify-content: center; gap: 15px; padding: 10px 0; }
        .btn { padding: 10px 24px; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-stop { background: #d32f2f; color: #fff; }
        .btn-next { background: #ff5722; color: #fff; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <h1>Vivek Omegle</h1>
        <div class="status-badge" id="statusBadge">Tap Start Camera</div>
    </header>

    <div class="chat-container">
        <div class="video-grid">
            <div class="video-box">
                <video id="strangerVideo" autoplay playsinline muted></video>
                <div class="label">Stranger</div>
            </div>
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="label">You</div>
            </div>
        </div>

        <div class="controls-bar">
            <button class="btn" style="background:#333; color:#fff;" onclick="initCamera()">Start Camera</button>
            <button class="btn btn-stop" onclick="stopChat()">Stop</button>
            <button class="btn btn-next" onclick="findNext()">Next ⏭</button>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const strangerVideo = document.getElementById('strangerVideo');
        const statusBadge = document.getElementById('statusBadge');

        async function initCamera() {
            statusBadge.innerText = "Requesting camera...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
                statusBadge.innerText = "Connected - Searching...";
                statusBadge.style.background = "#2e7d32";
            } catch (err) {
                console.error(err);
                statusBadge.innerText = "Camera Error / Permission Denied";
                statusBadge.style.background = "#d32f2f";
                alert("Please check browser site settings and allow camera access.");
            }
        }

        function findNext() {
            statusBadge.innerText = "Searching for next stranger...";
            statusBadge.style.background = "#e65100";
            setTimeout(() => {
                statusBadge.innerText = "Connected with new stranger!";
                statusBadge.style.background = "#2e7d32";
            }, 1500);
        }

        function stopChat() {
            const stream = localVideo.srcObject;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            localVideo.srcObject = null;
            statusBadge.innerText = "Chat Stopped";
            statusBadge.style.background = "#757575";
        }
    </script>
</body>
</html>
