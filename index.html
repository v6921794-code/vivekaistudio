<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle - Split Screen Video & Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #fffaed; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Compact Header */
        header { padding: 8px 15px; border-bottom: 2px solid #e5c158; display: flex; justify-content: space-between; align-items: center; background: #fff; height: 45px; }
        .logo { font-size: 22px; font-weight: bold; color: #ff5722; text-shadow: 1px 1px 0px #000; }
        .online-status { font-size: 11px; color: #666; font-style: italic; }

        /* Main Container: Split 50% Top (Video) and 50% Bottom (Chat) */
        .split-container { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 45px); overflow: hidden; }

        /* Top Half: Video & Controls */
        .top-screen { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; border-bottom: 2px solid #e5c158; min-height: 0; }
        .video-grid { flex: 1; display: flex; width: 100%; height: 100%; position: relative; }
        .cam-box { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; border-right: 1px solid #333; }
        .cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-label { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 10px; z-index: 5; }

        /* Video Controls Bar overlaid or right below */
        .video-controls { background: rgba(0,0,0,0.8); padding: 6px; display: flex; justify-content: center; gap: 10px; }
        .btn-vid { padding: 6px 16px; background: #ff5722; color: #fff; border: none; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-vid:hover { background: #e64a19; }

        /* Bottom Half: Chat Log & Input */
        .bottom-screen { flex: 1; display: flex; flex-direction: column; background: #fff; min-height: 0; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; font-size: 13px; background: #fff; }
        
        .msg { line-height: 1.3; }
        .msg.stranger { color: red; font-weight: bold; }
        .msg.you { color: blue; font-weight: bold; }
        .msg.status { color: #00a; font-style: italic; font-size: 12px; border-bottom: 1px dotted #ccc; padding-bottom: 3px; }

        /* Input Row */
        .chat-input-bar { display: flex; padding: 8px; background: #f5f5f5; border-top: 1px solid #ddd; gap: 6px; }
        .text-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
        .btn-send { background: #0066cc; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-send:hover { background: #004d99; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Omegle</div>
        <div class="online-status">Talk to strangers with your webcam!</div>
    </header>

    <div class="split-container">
        <!-- TOP SCREEN: Cameras & Video Actions -->
        <div class="top-screen">
            <div class="video-grid">
                <div class="cam-box">
                    <video id="strangerVideo" autoplay playsinline muted></video>
                    <div class="cam-label">Stranger</div>
                </div>
                <div class="cam-box">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="cam-label">You</div>
                </div>
            </div>
            <div class="video-controls">
                <button class="btn-vid" id="controlBtn" onclick="handleNewOrDisconnect()">New / Esc</button>
            </div>
        </div>

        <!-- BOTTOM SCREEN: Chat Log & Input Bar -->
        <div class="bottom-screen">
            <div class="chat-messages" id="chatBox">
                <div class="msg status">Connecting to server...</div>
                <div class="msg status">You're now chatting with a random stranger. Say hi!</div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="userInput" class="text-input" placeholder="Type a message here..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const controlBtn = document.getElementById('controlBtn');
        const localVideo = document.getElementById('localVideo');
        
        let chatActive = true;

        // Initialize local camera
        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
            } catch (err) {
                appendStatus("Webcam access blocked or not found.");
            }
        }
        initWebcam();

        function appendStatus(text) {
            const div = document.createElement('div');
            div.className = 'msg status';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.innerText = (sender === 'you' ? 'You: ' : 'Stranger: ') + text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMessage() {
            const text = userInput.value.trim();
            if (!text || !chatActive) return;
            appendMessage('you', text);
            userInput.value = '';

            // Simulated auto-reply
            setTimeout(() => {
                if (chatActive) {
                    const responses = [
                        "Hello there!",
                        "Aap kaise ho?",
                        "Nice chatting with you!",
                        "Kya haal hai?",
                        "Ji boliye!"
                    ];
                    const reply = responses[Math.floor(Math.random() * responses.length)];
                    appendMessage('stranger', reply);
                }
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function handleNewOrDisconnect() {
            appendStatus("You have disconnected.");
            chatActive = false;
            controlBtn.innerText = "Connecting...";

            setTimeout(() => {
                chatBox.innerHTML = '';
                appendStatus("Looking for someone you may know...");
                setTimeout(() => {
                    appendStatus("Connected with a new stranger!");
                    chatActive = true;
                    controlBtn.innerText = "New / Esc";
                }, 1500);
            }, 1000);
        }
    </script>
</body>
</html>
