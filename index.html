<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek AI Studio - VN Editor Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1a1a1a; border-bottom: 1px solid #2c2c2c; }
        header h1 { font-size: 16px; color: #ff5722; }
        .export-btn { background: #ff5722; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .preview-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .upload-overlay { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; }
        .upload-overlay label { background: #2b2b2b; padding: 10px 20px; border-radius: 6px; cursor: pointer; border: 1px solid #444; }

        /* Dynamic Overlay Elements */
        #textOverlay { position: absolute; bottom: 40px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; display: none; pointer-events: none; }

        .timeline-section { height: 210px; background: #181818; border-top: 1px solid #2c2c2c; display: flex; flex-direction: column; }
        .timeline-tools { display: flex; gap: 12px; padding: 8px 15px; background: #1f1f1f; border-bottom: 1px solid #2c2c2c; font-size: 13px; color: #bbb; overflow-x: auto; }
        .timeline-tools span { cursor: pointer; padding: 5px 10px; border-radius: 4px; background: #2a2a2a; white-space: nowrap; }
        .timeline-tools span:hover { background: #ff5722; color: #fff; }
        
        .tracks-container { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .track { height: 40px; background: #222; border-radius: 6px; border: 1px dashed #444; display: flex; align-items: center; padding: 0 10px; position: relative; font-size: 11px; color: #777; }
        .track-label { position: absolute; top: 2px; left: 8px; font-size: 9px; }
        .clip-box { background: #ff5722; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; padding: 0 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Vivek AI Studio</h1>
        <button class="export-btn" onclick="alert('Video project ready for final rendering!')">Export ↗</button>
    </header>

    <div class="preview-container" id="previewContainer">
        <div class="upload-overlay" id="uploadOverlay">
            <input type="file" id="mediaInput" accept="video/*" style="display: none;" onchange="loadVideo(event)">
            <label for="mediaInput">＋ Tap to Import Video</label>
        </div>
        <video id="mainVideo" controls style="display: none;"></video>
        <div id="textOverlay">Sample Subtitle</div>
        <audio id="bgAudio"></audio>
    </div>

    <div class="timeline-section">
        <div class="timeline-tools">
            <span onclick="splitClip()">✂ Split</span>
            <span onclick="applyFilter()">🎨 Filter</span>
            <span onclick="addSubtitle()">💬 Subtitle</span>
            <span onclick="addMusic()">🎵 Music (Song)</span>
        </div>
        <div class="tracks-container">
            <div class="track" id="videoTrack">
                <span class="track-label">VIDEO</span>
                <span>Empty video track</span>
            </div>
            <div class="track" id="audioTrack">
                <span class="track-label">AUDIO / SONG</span>
                <span>Empty music track</span>
            </div>
            <div class="track" id="textTrack">
                <span class="track-label">TEXT</span>
                <span>Empty subtitle track</span>
            </div>
        </div>
    </div>

    <input type="file" id="audioInput" accept="audio/*" style="display: none;" onchange="loadAudio(event)">

    <script>
        const mainVideo = document.getElementById('mainVideo');
        const bgAudio = document.getElementById('bgAudio');
        const uploadOverlay = document.getElementById('uploadOverlay');
        const videoTrack = document.getElementById('videoTrack');
        const audioTrack = document.getElementById('audioTrack');
        const textTrack = document.getElementById('textTrack');
        const textOverlay = document.getElementById('textOverlay');
        const audioInput = document.getElementById('audioInput');

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                mainVideo.src = URL.createObjectURL(file);
                mainVideo.style.display = 'block';
                uploadOverlay.style.display = 'none';
                videoTrack.innerHTML = '<span class="track-label">VIDEO</span><div class="clip-box">Video Clip Loaded</div>';
            }
        }

        function splitClip() {
            if (!mainVideo.src) { alert('Load a video first!'); return; }
            alert('Video successfully split at ' + mainVideo.currentTime.toFixed(2) + 's');
        }

        let filterIndex = 0;
        const filters = ['none', 'grayscale(100%)', 'sepia(100%)', 'contrast(150%)', 'hue-rotate(90deg)'];
        function applyFilter() {
            if (!mainVideo.src) { alert('Load a video first!'); return; }
            filterIndex = (filterIndex + 1) % filters.length;
            mainVideo.style.filter = filters[filterIndex];
            alert('Applied Filter style: ' + (filters[filterIndex] || 'Normal'));
        }

        function addSubtitle() {
            if (!mainVideo.src) { alert('Load a video first!'); return; }
            const userText = prompt("Enter subtitle text:", "Vivek AI Studio Edit");
            if (userText) {
                textOverlay.innerText = userText;
                textOverlay.style.display = 'block';
                textTrack.innerHTML = '<span class="track-label">TEXT</span><div class="clip-box" style="background:#4caf50;">' + userText + '</div>';
            }
        }

        function addMusic() {
            if (!mainVideo.src) { alert('Load a video first!'); return; }
            audioInput.click();
        }

        function loadAudio(event) {
            const file = event.target.files[0];
            if (file) {
                bgAudio.src = URL.createObjectURL(file);
                bgAudio.play();
                mainVideo.play();
                audioTrack.innerHTML = '<span class="track-label">AUDIO / SONG</span><div class="clip-box" style="background:#2196f3;">' + file.name.substring(0, 15) + '...</div>';
                alert('Song added and synced with video playback!');
            }
        }
    </script>
</body>
</html>
