<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle - Talk to strangers!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #fdfdfd; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Header */
        header { padding: 15px 20px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .logo { font-size: 26px; font-weight: bold; color: #ff5722; letter-spacing: -1px; }
        .online-count { font-size: 13px; color: #666; background: #f1f1f1; padding: 4px 10px; border-radius: 12px; }

        /* Main Workspace split into Video and Chat */
        .omegle-main { flex: 1; display: flex; gap: 15px; padding: 15px; max-width: 1200px; margin: 0 auto; width: 100%; overflow: hidden; }
        
        /* Video Side */
        .video-column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .video-box-container { flex: 1; display: flex; gap: 10px; min-height: 0; }
        .cam-box { flex: 1; background: #000; border-radius: 8px; border: 2px solid #ccc; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; }

        /* Chat Side */
        .chat-column { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .chat-log { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 14px; background: #fafafa; }
        
        .chat-msg { line-height: 1.4; }
        .chat-msg.stranger { color: #d32f2f; }
        .chat-msg.you { color: #1976d2; }
        .chat-msg.system { color: #777; font-style: italic; font-size: 13px; text-align: center; border-bottom: 1px dashed #eee; padding-bottom: 4px; }

        /* Controls & Input Form */
        .chat-input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; gap: 8px; align-items: center; }
        .btn-control { padding: 10px 16px; border: 1px solid #ccc; background: #f8f8f8; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-control:hover { background: #eee; }
        .chat-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .btn-send { background: #007bff; color: #fff; border: none; padding: 10px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-send:hover { background: #0056b3; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Omegle</div>
        <div class="online-count">🟢 42,150 online now</div>
    </header>

    <div class="omegle-main">
        <!-- Videos -->
        <div class="video-column">
            <div class="video-box-container">
                <div class="cam-box">
                    <video id="strangerVideo" autoplay playsinline muted></video>
                    <div class="cam-label">Stranger</div>
                </div>
                <div class="cam-box">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="cam-label">You</div>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-control" id="actionBtn" onclick="handleNextOrDisconnect()" style="flex: 1; background: #ff5722; color: #fff; border: none; padding: 12px; font-size: 15px;">New / Esc</button>
            </div>
        </div>

        <!-- Text Chat -->
        <div class="chat-column">
            <div class="chat-log" id="chatLog">
                <div class="chat-msg system">You're now chatting with a random stranger. Say hi!</div>
            </div>
            <div class="chat-input-area">
                <button class="btn-control" onclick="startCamera()">Cam On</button>
                <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." onkeypress="checkEnter(event)">
                <button class="btn-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatLog = document.getElementById('chatLog');
        const messageInput = document.getElementById('messageInput');
        const actionBtn = document.getElementById('actionBtn');
        const localVideo = document.getElementById('localVideo');
        const strangerVideo = document.getElementById('strangerVideo');

        let isConnected = true;

        // Auto start local camera on load
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
            } catch (err) {
                appendSystemMessage("Camera access denied or unavailable.");
            }
        }
        startCamera();

        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'chat-msg system';
            div.innerText = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = 'chat-msg ' + sender;
            div.innerHTML = `<strong>${sender === 'you' ? 'You' : 'Stranger'}:</strong> ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !isConnected) return;
            appendMessage('you', text);
            messageInput.value = '';

            // Simulated Omegle automatic stranger reply
            setTimeout(() => {
                if (isConnected) {
                    const replies = [
                        "Hey there! kahan se ho?",
                        "Nice to meet you!",
                        "What's up?",
                        "Cool! Tell me more.",
                        "Haha accha ji!"
                    ];
                    const randomReply = replies[Math.floor(Math.random() * replies.length)];
                    appendMessage('stranger', randomReply);
                }
            }, 1200);
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function handleNextOrDisconnect() {
            appendSystemMessage("You have disconnected.");
            isConnected = false;
            actionBtn.innerText = "Connecting...";
            actionBtn.style.background = "#555";

            setTimeout(() => {
                chatLog.innerHTML = '';
                appendSystemMessage("Looking for someone you may know...");
                setTimeout(() => {
                    appendSystemMessage("Connected with a new stranger!");
                    isConnected = true;
                    actionBtn.innerText = "New / Esc";
                    actionBtn.style.background = "#ff5722";
                }, 1500);
            }, 1000);
        }
    </script>
</body>
</html>
