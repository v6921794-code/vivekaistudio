<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omegle - Talk to strangers!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #fffaed; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Classic Omegle Header */
        header { padding: 10px 20px; border-bottom: 2px solid #e5c158; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .logo { font-size: 28px; font-weight: bold; color: #ff5722; text-shadow: 1px 1px 0px #000; }
        .tagline { font-size: 13px; color: #666; font-style: italic; }

        /* Main Workspace */
        .omegle-wrapper { flex: 1; display: flex; gap: 15px; padding: 15px; max-width: 1100px; margin: 0 auto; width: 100%; overflow: hidden; }
        
        /* Left: Video Streams */
        .video-pane { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .video-box-row { flex: 1; display: flex; gap: 10px; min-height: 0; }
        .cam-frame { flex: 1; background: #000; border-radius: 4px; border: 2px solid #ccc; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .cam-frame video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-tag { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px; }

        /* Right: Chat Log */
        .chat-pane { flex: 1; display: flex; flex-direction: column; background: #fff; border: 2px solid #e5c158; border-radius: 4px; overflow: hidden; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 14px; background: #fff; }
        
        .msg { line-height: 1.4; }
        .msg.stranger { color: red; font-weight: bold; }
        .msg.you { color: blue; font-weight: bold; }
        .msg.status { color: #00a; font-style: italic; font-size: 13px; border-bottom: 1px dotted #ccc; padding-bottom: 4px; }

        /* Bottom Controls & Input */
        .controls-row { display: flex; gap: 10px; padding: 8px; background: #f5f5f5; border-top: 1px solid #ddd; }
        .btn-action { padding: 10px 18px; border: 1px solid #999; background: #eee; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-action:hover { background: #e0e0e0; }

        .input-row { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; gap: 8px; align-items: center; }
        .text-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .btn-send { background: #0066cc; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-send:hover { background: #004d99; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Omegle</div>
        <div class="tagline">Talk to strangers with your webcam!</div>
    </header>

    <div class="omegle-wrapper">
        <!-- Video Box Area -->
        <div class="video-pane">
            <div class="video-box-row">
                <div class="cam-frame">
                    <video id="strangerVideo" autoplay playsinline muted></video>
                    <div class="cam-tag">Stranger</div>
                </div>
                <div class="cam-frame">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="cam-tag">You</div>
                </div>
            </div>
            <button class="btn-action" id="controlBtn" onclick="handleNewOrDisconnect()" style="background: #ff5722; color: #fff; border: none; padding: 12px; font-size: 15px;">New / Esc</button>
        </div>

        <!-- Chat Area -->
        <div class="chat-pane">
            <div class="chat-messages" id="chatBox">
                <div class="msg status">Connecting to server...</div>
                <div class="msg status">You're now chatting with a random stranger. Say hi!</div>
            </div>
            <div class="input-row">
                <input type="text" id="userInput" class="text-input" placeholder="Type a message here..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const controlBtn = document.getElementById('controlBtn');
        const localVideo = document.getElementById('localVideo');
        
        let chatActive = true;

        // Initialize local camera
        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
            } catch (err) {
                appendStatus("Webcam access blocked or not found.");
            }
        }
        initWebcam();

        function appendStatus(text) {
            const div = document.createElement('div');
            div.className = 'msg status';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.innerText = (sender === 'you' ? 'You: ' : 'Stranger: ') + text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMessage() {
            const text = userInput.value.trim();
            if (!text || !chatActive) return;
            appendMessage('you', text);
            userInput.value = '';

            // Classic simulated auto-reply
            setTimeout(() => {
                if (chatActive) {
                    const responses = [
                        "Hello!",
                        "Aap kahan se ho?",
                        "Hey bro, kya haal hai?",
                        "Nice to meet you here.",
                        "Ji boliye!"
                    ];
                    const reply = responses[Math.floor(Math.random() * responses.length)];
                    appendMessage('stranger', reply);
                }
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        function handleNewOrDisconnect() {
            appendStatus("You have disconnected.");
            chatActive = false;
            controlBtn.innerText = "Connecting...";

            setTimeout(() => {
                chatBox.innerHTML = '';
                appendStatus("Looking for someone you may know...");
                setTimeout(() => {
                    appendStatus("Connected with a new stranger!");
                    chatActive = true;
                    controlBtn.innerText = "New / Esc";
                }, 1500);
            }, 1000);
        }
    </script>
</body>
</html>
